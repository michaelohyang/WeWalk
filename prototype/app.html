<title>WeWalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: a clean, list-first phone app. White canvas, soft grey tiles, one teal brand color,
   and 0–10 score circles that carry all the color. Fixed bottom tab bar; pages stack in one column. */
:root{
  --bg:#FFFFFF; --surface:#F4F5F4; --surface-2:#EBEDEC; --card:#FFFFFF;
  --fg:#111413; --fg-2:#5B6260; --muted:#969D9A; --line:#E6E8E7;
  --brand:#0D8A72; --brand-ink:#FFFFFF; --brand-soft:#E2F3EE;
  --s-great:#139E55; --s-good:#6FAE1E; --s-ok:#EE9A0A; --s-bad:#E5484D;
  --h-mid:#3E63DD; --h-flat:#8E4EC6; --h-down:#D6409F; --h-bk:#0A97B0;
  --water:#E5EEF2; --land:#FBFBFA; --land-far:#EEF0EF;
  --shadow:0 1px 2px rgba(16,24,22,.06),0 8px 24px rgba(16,24,22,.08);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:24px; --r-md:16px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0E0E; --surface:#171A1A; --surface-2:#202424; --card:#131616;
  --fg:#F1F3F2; --fg-2:#A8AFAD; --muted:#6C7472; --line:#252A29;
  --brand:#2DBA98; --brand-ink:#04120E; --brand-soft:#11302A;
  --s-great:#30C46F; --s-good:#94CC3D; --s-ok:#F5AE2E; --s-bad:#FF6369;
  --h-mid:#6E8BF0; --h-flat:#B07EE3; --h-down:#EC69B8; --h-bk:#2DB7CF;
  --water:#0F181C; --land:#191D1D; --land-far:#141717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0E0E; --surface:#171A1A; --surface-2:#202424; --card:#131616;
  --fg:#F1F3F2; --fg-2:#A8AFAD; --muted:#6C7472; --line:#252A29;
  --brand:#2DBA98; --brand-ink:#04120E; --brand-soft:#11302A;
  --s-great:#30C46F; --s-good:#94CC3D; --s-ok:#F5AE2E; --s-bad:#FF6369;
  --h-mid:#6E8BF0; --h-flat:#B07EE3; --h-down:#EC69B8; --h-bk:#2DB7CF;
  --water:#0F181C; --land:#191D1D; --land-far:#141717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tab-h) + 32px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.sub{color:var(--fg-2);font-size:13px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.top h1{font-size:30px;font-weight:900;letter-spacing:-.04em}
.top h1 span{color:var(--brand)}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--fg)}
.round svg{width:20px;height:20px}
.banner{font-size:12.5px;background:var(--surface);color:var(--fg-2);border-radius:12px;padding:9px 12px;margin-block:0 12px}

/* ---------- search + segmented ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding-inline:14px;height:46px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px}
.search input::placeholder{color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:3px;gap:3px;margin-block:12px 4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:700;font-size:14px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:10px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--fg)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--fg))}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* ---------- score circle ---------- */
.sc{--sz:44px;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--c);color:var(--c);
  background:color-mix(in srgb,var(--c) 9%,transparent);font-weight:800;font-size:15px;letter-spacing:-.02em}
.sc.sm{--sz:34px;font-size:12.5px;border-width:2px}
.sc.lg{--sz:76px;font-size:26px;border-width:3.5px}
.sc.none{--c:var(--muted);border-style:dashed;background:none;font-size:13px}

/* ---------- map ---------- */
.mapcard{position:relative;border-radius:var(--r-lg);background:var(--water);overflow:hidden;margin-top:12px}
.map{display:block;width:100%;height:auto}
.map .land{fill:var(--land);pointer-events:none}
.map .land.far{fill:var(--land-far)}
.map .street{stroke:var(--line);stroke-width:1;fill:none;pointer-events:none}
.map .geo{font:700 8px var(--f);fill:var(--muted);letter-spacing:.16em;text-transform:uppercase}
.map .water-l{font:600 8px var(--f);fill:var(--muted);letter-spacing:.32em;opacity:.8}
.stn{cursor:pointer}
.stn:focus{outline:none}
.stn .hit{fill:transparent}
.stn .pill{stroke:var(--land);stroke-width:2}
.stn .pv{font:800 10px var(--f);fill:#FFFFFF;pointer-events:none;letter-spacing:-.02em}
.stn .dot{fill:var(--muted);stroke:var(--land);stroke-width:2}
.stn .nm{font:600 8.4px var(--f);fill:var(--fg-2);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.stn.unlit .nm{fill:var(--muted);font-weight:500}
.stn.dim{opacity:.15}
.stn.sel .pill,.stn:focus-visible .pill{stroke:var(--fg);stroke-width:2.5}
.stn.sel .dot,.stn:focus-visible .dot{fill:var(--fg)}
.stn .glow{fill:none;stroke:var(--brand);stroke-width:2.5;opacity:0;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center}
.stn.lit .glow{animation:glow 1.5s ease-out 2}
@keyframes glow{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 2px 0;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* ---------- rows (lists everywhere) ---------- */
.list{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--fg)}
.row:last-child{border-bottom:0}
.row .t{font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.25}
.row .m{font-size:12.5px;color:var(--fg-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.row .rk{width:24px;text-align:center;font-weight:800;font-size:16px;color:var(--muted)}
.row .rk.top{color:var(--brand)}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.03em;
  background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.hood{display:inline-flex;align-items:center;gap:5px}
.hood::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.been{color:var(--brand);font-weight:700}

/* ---------- sections + cards ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-block:28px 8px}
.sec h2{font-size:20px}
.sec .sub{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.empty{background:var(--surface);border-radius:var(--r-md);padding:18px;color:var(--fg-2);font-size:14px}
.empty b{display:block;color:var(--fg);font-size:16px;font-weight:800;margin-bottom:3px;letter-spacing:-.01em}
.empty .btn{margin-top:12px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;background:var(--surface);color:var(--fg);transition:transform .1s,filter .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:0;font-weight:600;font-size:13.5px;color:var(--fg-2);text-decoration:underline;text-underline-offset:3px}
.link.brand{color:var(--brand);text-decoration:none}

/* ---------- preview sheet ---------- */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 24px));z-index:30;
  background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translate(-50%,20px);opacity:0}}
.sheet .hd{display:flex;gap:12px;align-items:center}
.sheet h3{font-size:19px}
.sheet .q{font-weight:600;font-size:15px;line-height:1.35;margin-block:12px 14px;color:var(--fg)}
.sheet .acts{display:grid;grid-template-columns:1fr auto;gap:8px}

/* ---------- station page ---------- */
.page{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.navbar{display:flex;justify-content:space-between;align-items:center;padding-block:14px 6px}
.hero h1{font-size:clamp(30px,8.6vw,40px);font-weight:900;letter-spacing:-.04em;margin-top:8px}
.hero .addr{color:var(--fg-2);font-size:14px;margin-top:6px}
.scorebox{display:flex;align-items:center;gap:16px;margin-top:18px;padding:16px;background:var(--surface);border-radius:var(--r-lg)}
.scorebox .lbl{font-weight:800;font-size:18px;letter-spacing:-.02em}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hot{margin-top:22px;padding:20px 18px;border-radius:var(--r-lg);background:var(--fg);color:var(--bg)}
.hot .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.hot p{margin:8px 0 10px;font-size:clamp(22px,6.2vw,28px);font-weight:900;line-height:1.12;letter-spacing:-.03em;text-wrap:balance}
.hot .by{font-size:13px;opacity:.7}
.rate{display:grid;grid-template-columns:38px minmax(0,1fr) 92px 34px;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.rate:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--fg-2)}
.ic svg{width:20px;height:20px}
.rate .l{font-weight:700;font-size:14.5px;line-height:1.2}
.rate .l small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.rate .v{font-weight:800;font-size:14px;text-align:right;color:var(--c)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:600;font-size:13px;color:var(--fg)}
.tag b{color:var(--muted);margin-left:3px}
.post{display:grid;gap:8px;padding-block:16px;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post .hd{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--c);flex:none}
.post .who{font-weight:700;font-size:15px}
.post .ht{font-weight:800;font-size:16.5px;letter-spacing:-.015em;line-height:1.3}
.post p{margin:0;color:var(--fg);max-width:62ch}
.post .sc.sm{margin-left:auto}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photos figure{margin:0;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.log li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:5px}
.log li:not(:last-child)::after{content:"";position:absolute;left:4px;top:19px;bottom:0;width:2px;background:var(--line)}
.log .d{font-weight:700;font-size:13.5px}
.log p{margin:2px 0 0;color:var(--fg-2);font-size:14px}

/* ---------- inputs + form ---------- */
.field{display:grid;gap:6px}
.field>span{font-weight:700;font-size:13px;color:var(--fg-2)}
.inp{width:100%;border:1.5px solid transparent;border-radius:14px;background:var(--surface);padding:12px 14px;font-size:16px;min-width:0;outline:none}
.inp:focus{border-color:var(--brand);background:var(--card)}
textarea.inp{resize:vertical;min-height:90px}
.inp::placeholder{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 152px;gap:8px}
.form{display:grid;gap:20px;margin-top:20px}
.grp{display:grid;gap:10px}
.tap{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px 12px;align-items:center;padding:14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line)}
.tap .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.tap .hd b{font-weight:700;font-size:15px}
.tap .quip{font-size:12.5px;color:var(--muted);text-align:right;min-width:0}
.tap.set .quip{color:var(--c);font-weight:700}
.tokens{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tokens button{height:42px;border-radius:12px;border:0;background:var(--surface);font-weight:800;font-size:15px;color:var(--fg-2);transition:transform .1s,background .15s}
.tokens button.on{background:var(--c);color:#fff}
.tokens button:active{transform:scale(.92)}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tagpick button{border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--card);font-weight:600;font-size:13.5px}
.tagpick button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.stickybar{position:sticky;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));z-index:5;padding-top:6px}
.stickybar .btn{box-shadow:var(--shadow)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.err{color:var(--s-bad);font-weight:700;font-size:14px;margin:0}

/* ---------- ranks ---------- */
.spot{border-radius:var(--r-lg);padding:20px 18px;background:var(--fg);color:var(--bg);display:grid;gap:4px;position:relative}
.spot .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.6;padding-right:86px}
.spot h2{font-size:clamp(26px,7.6vw,34px);font-weight:900;letter-spacing:-.04em;padding-right:86px;margin-top:6px}
.spot .m{font-size:13px;opacity:.7}
.spot .q{font-size:16px;font-weight:600;line-height:1.35;margin:12px 0 14px;max-width:36ch}
.spot .sc{position:absolute;right:18px;top:18px}
.spot .btn{justify-self:start;background:var(--bg);color:var(--fg)}

/* ---------- passport ---------- */
.pp{display:flex;align-items:center;gap:18px;padding:18px;border-radius:var(--r-lg);background:var(--brand-soft)}
.pp svg{width:96px;height:96px;flex:none}
.pp .big{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1}
.pp .big span{color:var(--fg-2);font-size:18px;font-weight:700}
.pp p{margin:6px 0 0;color:var(--fg-2);font-size:14px}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stamp{border:0;border-radius:20px;padding:14px 8px 12px;display:grid;justify-items:center;gap:8px;text-align:center;color:var(--fg);background:color-mix(in srgb,var(--c) 11%,var(--card))}
.stamp .seal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:900;font-size:16px;letter-spacing:-.04em;box-shadow:inset 0 0 0 3px color-mix(in srgb,#fff 35%,transparent),inset 0 0 0 5px var(--c)}
.stamp .n{font-weight:700;font-size:12.5px;line-height:1.2;overflow-wrap:anywhere}
.stamp .d{font-size:11px;color:var(--fg-2);margin-top:-6px}
.stamp.slot{background:none;border:1.5px dashed var(--line)}
.stamp.slot .seal{background:var(--surface);color:var(--muted);box-shadow:none}
.stamp.slot .n{color:var(--fg-2);font-weight:600}
.stamp.thunk .seal{animation:thunk .6s cubic-bezier(.2,.9,.3,1.35)}
@keyframes thunk{0%{transform:scale(2.2) rotate(-18deg);opacity:0}55%{transform:scale(.9) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;height:var(--tab-h);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding-inline:8px}
.tabs button{background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:3px;font-weight:600;font-size:10.5px;padding:6px 0}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs .plus{width:48px;height:48px;border-radius:16px;background:var(--brand);color:var(--brand-ink);justify-self:center;display:grid;place-items:center;padding:0}
.tabs .plus svg{width:24px;height:24px}

/* ---------- toast + confirm ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);animation:drop .25s ease-out;max-width:calc(100% - 32px);text-align:center}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:0}}
.confirm{display:grid;gap:10px;margin-top:10px;padding:14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--s-bad) 9%,var(--card))}
.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{background:var(--s-bad);color:#fff}
.foot{margin-top:34px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div class="app" id="app"></div>
<div id="sheet-root"></div>
<div class="tabs"><nav id="tabs" aria-label="Main"></nav></div>
<div id="toast-root" aria-live="polite"></div>

<script>
/* ============================================================
   WeWalk: NYC WeWorks, rated by people who care too much.
   Shared data lives in the artifact db; falls back to this
   device's localStorage when the db isn't available.
   ============================================================ */

// ---------- neighborhood groups ----------
const LINES = {
  midtown:  { name: "Midtown",  color: "var(--h-mid)" },
  flatiron: { name: "Flatiron", color: "var(--h-flat)" },
  downtown: { name: "Downtown", color: "var(--h-down)" },

const COLLS = ["reviews", "visits", "stations", "retired"];
const Store = {
  mode: "connecting", db: null, canWrite: true,
  async init(){
    const c = window.claude;
    if (c && typeof c.use === "function") {
      try {
        const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
        if (db) {
          this.db = db; this.mode = "shared";
          if (user) {
            try { const id = await user.id(); if (id) S.me.id = id; } catch {}
            try { const w = await user.can("data.write"); if (w === false) this.canWrite = false; } catch {}
          }
          return;
        }
      } catch {}
    }
    this.mode = "local";
  },
  watch(coll, cb, where){
    if (this.mode === "shared") {
      let q = this.db.collection(coll);
      if (where) q = q.where(where[0], "==", where[1]);
      return q.onSnapshot(snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn(coll, e); toast("Lost the connection to the shared logbook. Reload to reconnect."); });
    }
    const emit = () => { let rows = Object.entries(ls.get("wewalk:" + coll, {})).map(([id, v]) => ({ id, ...v })); if (where) rows = rows.filter(r => r[where[0]] === where[1]); cb(rows); };
    const h = () => emit(); this._local = this._local || new Set(); this._local.add(h);
    queueMicrotask(emit);
    return () => this._local.delete(h);
  },
  async set(coll, id, data){
    if (this.mode === "shared") return this.db.collection(coll).doc(id).set(data);
    const all = ls.get("wewalk:" + coll, {}); all[id] = data; ls.set("wewalk:" + coll, all);
    (this._local || []).forEach(h => h());
  },
  async del(coll, id){
    if (this.mode === "shared") return this.db.collection(coll).doc(id).delete();
    const all = ls.get("wewalk:" + coll, {}); delete all[id]; ls.set("wewalk:" + coll, all);
    (this._local || []).forEach(h => h());
  },
};

// ---------- derived ----------
function stations(){
  const gone = new Set(S.retired.map(r => r.id));
  return [...BASE_STATIONS, ...S.custom].filter(s => !gone.has(s.id));
}
const stationById = id => [...BASE_STATIONS, ...S.custom].find(s => s.id === id);
function stats(id){
  const rs = S.reviews.filter(r => r.stationId === id).sort((a,b) => (b.visitedOn||"").localeCompare(a.visitedOn||"") || (b.createdAt||0) - (a.createdAt||0));
  const vs = S.visits.filter(v => v.stationId === id);
  const cat = {};
  for (const c of CATS) { const xs = rs.map(r => r.scores?.[c.k]).filter(n => typeof n === "number"); cat[c.k] = xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
  const have = Object.values(cat).filter(v => v != null);
  const overall = have.length ? have.reduce((a,b)=>a+b,0)/have.length : null;
  const dates = [...rs.map(r => r.visitedOn), ...vs.map(v => v.date)].filter(Boolean).sort();
  const tagCount = {};
  rs.forEach(r => (r.tags||[]).forEach(t => tagCount[t] = (tagCount[t]||0) + 1));
  const hot = rs.find(r => r.hotTake && r.hotTake.trim());
  return { reviews: rs, visits: vs, cat, overall, visited: dates.length > 0, first: dates[0], last: dates[dates.length-1], tagCount, hot, dates };
}
function allTags(){
  const set = new Set(TAGS); S.reviews.forEach(r => (r.tags||[]).forEach(t => set.add(t)));
  const used = new Set(S.reviews.flatMap(r => r.tags || []));
  return [...set].filter(t => used.has(t));
}
function stationOfMonth(){
  const ym = todayISO().slice(0,7);
  const scored = stations().map(s => ({ s, st: stats(s.id) })).filter(x => x.st.overall != null);
  if (!scored.length) return null;
  const thisMonth = scored.filter(x => x.st.dates.some(d => d.startsWith(ym)));
  const pool = thisMonth.length ? thisMonth : scored;
  pool.sort((a,b) => b.st.overall - a.st.overall || b.st.reviews.length - a.st.reviews.length);
  return { ...pool[0], fresh: thisMonth.length > 0 };
}

function filters(){
  const tags = allTags();
  const hoodChips = `<button type="button" class="chip" data-hood="" aria-pressed="${!S.hood}">All</button>` +
    HOODS.map(h => `<button type="button" class="chip" data-hood="${esc(h.id)}" aria-pressed="${S.hood===h.id}" style="--c:${LINES[h.line].color}"><span class="dot"></span>${esc(h.id)}</button>`).join("");
  const tagChips = tags.map(t => `<button type="button" class="chip" data-tagf="${esc(t)}" aria-pressed="${S.tag===t}">${esc(t)}</button>`).join("");
  return `<div class="chips" aria-label="Neighborhood">${hoodChips}</div>${tags.length ? `<div class="chips" style="padding-top:2px" aria-label="Best for">${tagChips}</div>` : ""}`;
}
function stationRow(s, x, lead){
  return `<button type="button" class="row" data-open="${esc(s.id)}">
    ${lead ?? `<span class="tile" style="--c:${hoodColor(s.hood)}">${esc(tileText(s.name))}</span>`}
    <span style="min-width:0"><span class="t">${esc(s.name)}</span>
      <span class="m"><span class="hood" style="--c:${hoodColor(s.hood)}">${esc(s.hood)}</span>·
        ${x.visited ? `<span class="been">Been</span>· ${plural(x.reviews.length, "review")}` : `<span>Not yet</span>`}</span></span>
    ${sc(x.overall)}</button>`;
}
function renderMap(){
  const list = stations().map(s => ({ s, x: stats(s.id) }));
  const lit = list.filter(r => r.x.visited).length;
  const top = list.filter(r => r.x.overall != null).sort((a,b) => b.x.overall - a.x.overall).slice(0, 3);
  const shown = list.filter(r => matches(r.s, r.x));
  let body;
  if (S.homeMode === "list") {
    const sorted = shown.sort((a,b) => (b.x.overall ?? -1) - (a.x.overall ?? -1) || a.s.name.localeCompare(b.s.name));
    body = sorted.length ? `<div class="list" style="margin-top:6px">${sorted.map(r => stationRow(r.s, r.x)).join("")}</div>`
      : `<div class="empty" style="margin-top:12px"><b>No matches.</b>Nothing fits those filters. Loosen up a little.</div>`;
  } else {
    body = `<div class="mapcard">${mapSVG()}</div>
      <div class="legend"><span><i style="--c:var(--s-great)"></i>8.5+ elite</span><span><i style="--c:var(--s-good)"></i>7+ solid</span><span><i style="--c:var(--s-ok)"></i>5.5+ fine</span><span><i style="--c:var(--s-bad)"></i>pray</span><span><i style="--c:var(--muted)"></i>not yet</span></div>
      <div class="sec"><h2>Crew favorites</h2><span class="sub">${lit} of ${list.length} visited</span></div>
      ${top.length ? `<div class="list">${top.map(r => stationRow(r.s, r.x)).join("")}</div>`
        : `<div class="empty"><b>The map's all grey.</b>Nobody's rated anything yet. Go grab a coffee, then judge it.<br><button class="btn primary sm" type="button" data-tab="review">Rate your first station</button></div>`}`;
  }
  return `<section class="page">
    <label class="search">${UI.search}<input id="q" type="search" placeholder="Search 75 Rock, Dumbo, 18th St…" value="${esc(S.q)}" autocomplete="off" aria-label="Search stations"></label>
    <div class="seg" role="group" aria-label="View"><button type="button" data-mode="map" aria-pressed="${S.homeMode!=="list"}">Map</button><button type="button" data-mode="list" aria-pressed="${S.homeMode==="list"}">List</button></div>
    ${filters()}
    ${body}
    <p style="margin-top:18px"><button type="button" class="link" data-act="add-station">Missing a WeWork? Add it</button></p>
    ${S.confirm === "add-station" ? addStationForm() : ""}
  </section>`;
}
function addStationForm(){

    <h3 style="font-size:18px">Add a station</h3>

    <label class="field"><span>Neighborhood</span><select class="inp" id="ns-hood">${HOODS.map(h => `<option>${esc(h.id)}</option>`).join("")}</select></label>

// ---------- station page ----------
function renderStation(){
  const s = stationById(S.stationId);

  const tags = Object.entries(x.tagCount).sort((a,b) => b[1]-a[1]);
  const mine = r => r.authorId && r.authorId === S.me.id;
  const avgOf = r => { const v = CATS.map(c => r.scores?.[c.k]).filter(n => typeof n === "number"); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const log = [...x.visits.map(v => ({ d: v.date, by: v.by, text: v.note })),
               ...x.reviews.map(r => ({ d: r.visitedOn, by: r.by, text: "Posted a review" }))]

    <div class="navbar"><button class="round" type="button" data-tab="map" aria-label="Back">${UI.back}</button></div>
    <header class="hero">
      <span class="hood sub" style="--c:${hoodColor(s.hood)};font-weight:700">${esc(s.hood)}</span>

      <div class="addr">${esc(s.address)}</div>

    ${Store.canWrite ? `<div class="acts2"><button class="btn primary" type="button" data-review="${esc(s.id)}">Rate it</button><button class="btn" type="button" data-act="checkin">Check in</button></div>` : ""}
    ${x.hot ? `<div class="hot"><span class="k">Hot take</span><p>${esc(x.hot.hotTake)}</p><span class="by">— ${esc(x.hot.by || "anonymous")}</span></div>` : ""}

    <div class="sec"><h2>Scorecard</h2>${x.reviews.length ? `<span class="sub">out of 10</span>` : ""}</div>
    ${x.reviews.length ? `<div>${CATS.map(cat => { const v = x.cat[cat.k]; return `<div class="rate" style="--c:${tierColor(v)}">
        <span class="ic">${ICON[cat.k]}</span><span class="l">${esc(cat.label)}<small>${esc(cat.hint)}</small></span>
        <span class="bar"><i style="width:${v == null ? 0 : (v/5*100).toFixed(0)}%"></i></span><span class="v">${fmtScore(v)}</span></div>`; }).join("")}</div>`
      : `<div class="empty"><b>Unrated.</b>The coffee is unjudged and the phone booths are unaccounted for.</div>`}

    ${tags.length ? `<div class="sec"><h2>Known for</h2></div><div class="tags">${tags.map(([t,n]) => `<span class="tag">${esc(t)}${n>1?`<b>${n}</b>`:""}</span>`).join("")}</div>` : ""}

    <div class="sec"><h2>Reviews</h2>${x.reviews.length ? `<span class="sub">${x.reviews.length}</span>` : ""}</div>
    ${x.reviews.length ? `<div>${x.reviews.map(r => `<div class="post">
        <div class="hd">${avatar(r.by)}<div style="min-width:0"><div class="who">${esc(r.by || "anonymous")}</div><div class="sub">${esc(fmtDate(r.visitedOn))}</div></div>${sc(avgOf(r), "sm")}</div>
        ${r.hotTake ? `<div class="ht">“${esc(r.hotTake)}”</div>` : ""}
        ${r.text ? `<p>${esc(r.text)}</p>` : ""}
        ${(r.tags||[]).length ? `<div class="tags">${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        ${mine(r) && Store.canWrite ? `<div style="display:flex;gap:16px"><button class="link" type="button" data-edit="${esc(r.id)}">Edit</button><button class="link" type="button" data-delrev="${esc(r.id)}">Delete</button></div>` : ""}
        ${S.confirm === "del:" + r.id ? `<div class="confirm"><b>Delete this review for good?</b><div class="btns"><button class="btn danger sm" type="button" data-delrev-yes="${esc(r.id)}">Delete</button><button class="btn sm" type="button" data-act="cancel">Keep it</button></div></div>` : ""}
      </div>`).join("")}</div>` : `<div class="empty"><b>Crickets.</b>First review gets to set the narrative.</div>`}

    <div class="sec"><h2>Photos</h2>${Store.canWrite ? `<label class="btn sm filebtn">Add photo<input type="file" id="ph-add" accept="image/*" multiple></label>` : ""}</div>
    ${S.photos.length ? `<div class="photos">${S.photos.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p => `<figure><img src="${esc(p.data)}" alt="Photo of ${esc(s.name)} by ${esc(p.by || "anonymous")}" loading="lazy"></figure>`).join("")}</div>`

      <button class="btn dark" type="submit">Log visit</button></form>` : ""}

    <div style="margin-top:28px">${S.confirm === "retire" ? `<div class="confirm"><b>Remove ${esc(s.name)} from the map?</b><span class="sub">For closed buildings or wrong addresses. Reviews stay in the logbook.</span><div class="btns"><button class="btn danger sm" type="button" data-act="retire-yes">Remove station</button><button class="btn sm" type="button" data-act="cancel">Never mind</button></div></div>`
      : Store.canWrite ? `<button class="link" type="button" data-act="retire">Closed or wrong address? Remove this station</button>` : ""}</div>
  </article>`;
}

// ---------- ranks ----------
function renderRanks(){
  const som = stationOfMonth();
  const key = S.sort;
  const rows = stations().map(s => { const x = stats(s.id); return { s, x, v: key === "overall" ? x.overall : x.cat[key] }; })
    .filter(r => r.v != null).sort((a,b) => b.v - a.v || b.x.reviews.length - a.x.reviews.length);
  const unrated = stations().filter(s => stats(s.id).overall == null).length;
  const sortChips = [{ k:"overall", label:"Overall" }, ...CATS].map(c => `<button type="button" class="chip" data-sort="${c.k}" aria-pressed="${key===c.k}">${esc(c.label)}</button>`).join("");
  const catLabel = key === "overall" ? "overall" : CATS.find(c => c.k === key).label.toLowerCase();
  const monthName = new Date().toLocaleDateString("en-US", { month: "long" });
  return `<section class="page">
    <div class="top"><h1>Ranks</h1></div>
    ${som ? `<div class="spot">
        ${sc(som.st.overall, "lg")}
        <span class="k">${som.fresh ? "Station of the Month · " + esc(monthName) : "All-time champ · quiet " + esc(monthName)}</span>
        <h2>${esc(som.s.name)}</h2>
        <span class="m">${esc(som.s.hood)} · ${plural(som.st.reviews.length, "review")}</span>
        <p class="q">${som.st.hot ? "“" + esc(som.st.hot.hotTake) + "”" : "Top marks, zero words. Classic."}</p>
        <button class="btn sm" type="button" data-open="${esc(som.s.id)}">View station</button></div>`
      : `<div class="empty"><b>Station of the Month: TBD</b>Rate one building and it wins by default. That's democracy.</div>`}
    <div class="sec"><h2>Best ${key === "overall" ? "overall" : "for " + esc(catLabel)}</h2><span class="sub">${rows.length} rated</span></div>
    <div class="chips" style="padding-top:0">${sortChips}</div>
    ${rows.length ? `<div class="list" style="margin-top:4px">${rows.map((r, i) => `<button type="button" class="row" data-open="${esc(r.s.id)}">
        <span class="rk ${i < 3 ? "top" : ""}">${i+1}</span>
        <span style="min-width:0"><span class="t">${esc(r.s.name)}</span><span class="m"><span class="hood" style="--c:${hoodColor(r.s.hood)}">${esc(r.s.hood)}</span>· ${plural(r.x.reviews.length, "review")}</span></span>
        ${sc(r.v)}</button>`).join("")}</div>`
      : `<div class="empty"><b>No ${esc(catLabel)} scores yet.</b>Somebody has to try it first.</div>`}
    ${rows.length && unrated ? `<p class="sub" style="margin-top:14px">${plural(unrated, "station")} still unrated. Field trip?</p>` : ""}
  </section>`;
}

// ---------- passport ----------
function renderPassport(){
  const list = stations().map(s => ({ s, x: stats(s.id) }));
  const got = list.filter(r => r.x.visited).sort((a,b) => (a.x.first||"").localeCompare(b.x.first||""));
  const not = list.filter(r => !r.x.visited).sort((a,b) => a.s.name.localeCompare(b.s.name));
  const frac = list.length ? got.length / list.length : 0, pct = Math.round(frac * 100);
  const C = 2 * Math.PI * 40;
  const quip = pct === 0 ? "Fresh passport. Not a single stamp. Bold." : pct < 25 ? "Barely out of the lobby. Keep going." : pct < 50 ? "Respectable. Your MetroCard is sweating." : pct < 100 ? "Seasoned. You have opinions about elevator banks." : "Every single one. Touch grass, then go again.";
  const stamp = (r, slot) => `<button type="button" class="stamp ${slot ? "slot" : ""} ${S.justStamped === r.s.id ? "thunk" : ""}" data-open="${esc(r.s.id)}" style="--c:${hoodColor(r.s.hood)}" aria-label="${esc(r.s.name)}${slot ? ", not visited" : ", first visit " + esc(fmtDate(r.x.first))}">
      <span class="seal">${slot ? "?" : esc(tileText(r.s.name))}</span><span class="n">${esc(r.s.name)}</span>${slot ? "" : `<span class="d">${esc(fmtDate(r.x.first))}</span>`}</button>`;
  return `<section class="page">
    <div class="top"><h1>Passport</h1></div>
    <div class="pp">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="var(--brand)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/>
        <text x="50" y="56" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-weight="800" font-size="20" fill="var(--fg)">${pct}%</text></svg>
      <div><div class="big">${got.length}<span> / ${list.length} stations</span></div><p>${esc(quip)}</p></div>
    </div>
    <div class="sec"><h2>Stamps</h2><span class="sub">${got.length}</span></div>
    ${got.length ? `<div class="stamps">${got.map(r => stamp(r)).join("")}</div>` : `<div class="empty"><b>No stamps yet.</b>Log your first visit and one lands right here.</div>`}
    ${not.length ? `<div class="sec"><h2>Still out there</h2><span class="sub">${not.length} to go</span></div><div class="stamps">${not.map(r => stamp(r, true)).join("")}</div>` : ""}
  </section>`;
}

// ---------- crew ----------
function renderCrew(){
  const by = {};
  const bump = (n) => by[n] = by[n] || { reviews: 0, visits: 0, stns: new Set(), hot: null };
  for (const r of S.reviews) { const k = (r.by || "anonymous").trim(); bump(k); by[k].reviews++; by[k].stns.add(r.stationId); if (r.hotTake && !by[k].hot) by[k].hot = r.hotTake; }
  for (const v of S.visits) { const k = (v.by || "anonymous").trim(); bump(k); by[k].visits++; by[k].stns.add(v.stationId); }
  const crew = Object.entries(by).sort((a,b) => b[1].stns.size - a[1].stns.size || b[1].reviews - a[1].reviews);
  const theme = ls.get("wewalk:theme", "system");
  return `<section class="page">
    <div class="top"><h1>Crew</h1></div>
    <form class="card grp" id="nameform">
      <div style="display:flex;gap:12px;align-items:center">${avatar(S.me.name || "?")}<div><b>${esc(S.me.name || "No name yet")}</b><div class="sub">No accounts. This name goes on your reviews.</div></div></div>
      <div class="two" style="grid-template-columns:minmax(0,1fr) auto"><input class="inp" id="me-name" maxlength="30" placeholder="Dana who hates open floor plans" value="${esc(S.me.name)}" aria-label="Display name"><button class="btn dark" type="submit">Save</button></div>
    </form>
    <div class="sec"><h2>Leaderboard</h2><span class="sub">by stations visited</span></div>
    ${crew.length ? `<div class="list">${crew.map(([n, c], i) => `<div class="row">${avatar(n)}
        <span style="min-width:0"><span class="t">${esc(n)}</span><span class="m">${plural(c.reviews, "review")} · ${plural(c.visits, "check-in")}</span>
        ${c.hot ? `<span class="m" style="font-style:italic">“${esc(c.hot)}”</span>` : ""}</span>
        <span class="rk ${i === 0 ? "top" : ""}" style="width:auto">${c.stns.size}</span></div>`).join("")}</div>`
      : `<div class="empty"><b>Leaderboard's empty.</b>Post one review and you're number one. Easiest win in New York.</div>`}
    <div class="sec"><h2>Appearance</h2></div>
    <div class="seg" role="group" aria-label="Theme" style="margin-top:0">${["system","light","dark"].map(t => `<button type="button" data-theme-set="${t}" aria-pressed="${theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
  </section>`;
}

// ---------- main render ----------
function render(){
  const app = $("#app");
  const banner = Store.mode === "local" ? `<div class="banner">Offline mode: reviews save on this device only. Open the shared link to post for the whole crew.</div>`
    : !Store.canWrite && Store.mode === "shared" ? `<div class="banner">View-only. Ask whoever shared this for Contributor access to post.</div>` : "";
  const top = S.view === "map" ? `<header class="top">
      <div><h1>We<span>Walk</span></h1><div class="sub">NYC WeWorks, rated by people who care too much</div></div>
      <button class="round" type="button" data-act="theme" aria-label="Toggle dark mode">${UI.moon}</button></header>` : "";
  let body = "";
  if (S.view === "map") body = renderMap();
  else if (S.view === "station") body = renderStation();
  else if (S.view === "review") body = renderForm();
  else if (S.view === "ranks") body = renderRanks();
  else if (S.view === "passport") body = renderPassport();
  else if (S.view === "crew") body = renderCrew();
  // keep focused field, caret and typed values when live updates re-render
  const act = document.activeElement, fid = act && act.id, sel = fid && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null;
  const keep = render.lastView === S.view ? [...app.querySelectorAll("input[id]:not([type=file]),textarea[id],select[id]")].map(el => [el.id, el.value]) : [];
  render.lastView = S.view;
  app.innerHTML = top + banner + body + `<div class="foot">Unofficial. Not affiliated with WeWork. Just opinions.</div>`;
  for (const [id, v] of keep) { const el = document.getElementById(id); if (el && el.value !== v) el.value = v; }
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(...sel); } catch {} } }
  renderTabs(); renderSheet();
}

// ---------- navigation ----------
function go(view, opts = {}){
  if (photoUnsub) { photoUnsub(); photoUnsub = null; S.photos = []; }
  S.view = view; S.confirm = null;
  if (view !== "map") S.sel = null;
  if (view === "station") {
    S.stationId = opts.id;
    photoUnsub = Store.watch("photos", rows => { S.photos = rows; if (S.view === "station") render(); }, ["stationId", opts.id]);
  }
  if (view === "review") S.draft = newDraft(opts.stationId, opts.review);
  render(); window.scrollTo({ top: 0 });
  if (view === "passport" && S.justStamped) setTimeout(() => { S.justStamped = null; }, 900);
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-stn]"); if (!t) { return; }
  const d = t.dataset;
  if (d.stn) { S.sel = S.sel === d.stn ? null : d.stn; render(); return; }
  if (d.tab) { if (d.tab === "review") go("review", { stationId: S.view === "station" ? S.stationId : S.sel }); else go(d.tab); return; }
  if (d.open) { go("station", { id: d.open }); return; }
  if (d.review) { go("review", { stationId: d.review }); return; }
  if (d.hood !== undefined) { S.hood = d.hood && S.hood !== d.hood ? d.hood : null; render(); return; }
  if (d.mode) { S.homeMode = d.mode; ls.set("wewalk:homeMode", d.mode); S.sel = null; render(); return; }
  if (d.tagf) { S.tag = S.tag === d.tagf ? null : d.tagf; render(); return; }
  if (d.sort) { S.sort = d.sort; render(); return; }
  if (d.edit) { const r = S.reviews.find(x => x.id === d.edit); if (r) go("review", { review: r }); return; }
  if (d.delrev) { S.confirm = "del:" + d.delrev; render(); return; }
  if (d.delrevYes) { Store.del("reviews", d.delrevYes).then(() => toast("Review deleted.")).catch(() => toast("Couldn't delete that. Try again.")); S.confirm = null; return; }
  if (d.themeSet) { setTheme(d.themeSet); render(); return; }
  if (d.tagpick) { const i = S.draft.tags.indexOf(d.tagpick); i < 0 ? S.draft.tags.push(d.tagpick) : S.draft.tags.splice(i, 1); t.setAttribute("aria-pressed", i < 0); return; }
  if (d.score) {
    const row = t.closest("[data-cat]"), k = row.dataset.cat, n = +d.score, cat = CATS.find(c => c.k === k);
    if (S.draft.scores[k] === n) delete S.draft.scores[k]; else S.draft.scores[k] = n;
    const v = S.draft.scores[k];
    row.style.setProperty("--c", v ? tierColor(v) : "var(--muted)"); row.classList.toggle("set", !!v);
    row.querySelectorAll("[data-score]").forEach(b => { const m = +b.dataset.score; b.classList.toggle("on", v === m); b.setAttribute("aria-checked", v === m); });
    $("#q-" + k).textContent = v ? cat.quips[v-1] : cat.hint;
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    return;
  }
  switch (d.act) {
    case "close-sheet": S.sel = null; render(); break;
    case "form-back": go(S.draft?.stationId && S.draft.id ? "station" : "map", { id: S.draft?.stationId }); break;
    case "theme": { const dark = isDark(); setTheme(dark ? "light" : "dark"); break; }
    case "add-station": S.confirm = S.confirm === "add-station" ? null : "add-station"; render(); setTimeout(() => $("#ns-name")?.focus(), 0); break;
    case "cancel": S.confirm = null; render(); break;
    case "checkin": { const n = $("#v-note"); if (n) { n.scrollIntoView({ block: "center", behavior: "smooth" }); n.focus({ preventScroll: true }); } break; }
    case "retire": S.confirm = "retire"; render(); break;
    case "retire-yes": Store.set("retired", S.stationId, { by: S.me.name || "", at: Date.now() }).then(() => { toast("Station removed."); go("map"); }).catch(() => toast("Couldn't remove it. Try again.")); break;
  }
});
document.addEventListener("keydown", e => {
  const g = e.target.closest && e.target.closest("[data-stn]");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); g.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  if (e.key === "Escape" && S.sel) { S.sel = null; render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; render(); return; }
  if (S.view !== "review" || !S.draft) return;
  const m = { "f-by": "by", "f-date": "visitedOn", "f-hot": "hotTake", "f-text": "text", "f-station": "stationId" }[e.target.id];
  if (m) S.draft[m] = e.target.value;
});
document.addEventListener("change", async e => {
  if (e.target.id === "f-station") S.draft.stationId = e.target.value;
  if (e.target.id === "f-photos") {
    const files = [...e.target.files].slice(0, 4 - S.draft.photos.length);
    for (const f of files) { try { S.draft.photos.push(await shrink(f)); } catch { toast("That photo wouldn't load. Try a JPEG or PNG."); } }
    $("#thumbs").innerHTML = S.draft.photos.map(p => `<img src="${p}" alt="Photo to upload">`).join("");
  }
  if (e.target.id === "ph-add") {
    const files = [...e.target.files].slice(0, 4);
    for (const f of files) {
      try { await Store.set("photos", rid(), { stationId: S.stationId, data: await shrink(f), by: S.me.name || "anonymous", authorId: S.me.id, createdAt: Date.now() }); }
      catch (err) { toast(err && err.code === "quota_exceeded" ? "Photo storage is full. Delete a few before adding more." : "Couldn't upload that photo."); }
    }
    if (files.length) toast("Photo added.");
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "reviewform") return saveReview();
  if (f.id === "visitform") {
    const note = $("#v-note").value.trim(), by = $("#v-name").value.trim(), date = $("#v-date").value;
    if (!note || !by || !date) { toast("Add a note, your name and a date."); return; }
    rememberName(by);
    const wasVisited = stats(S.stationId).visited;
    try { await Store.set("visits", rid(), { stationId: S.stationId, note, by, date, authorId: S.me.id, createdAt: Date.now() }); }
    catch { toast("That didn't save. Check your connection and try again."); return; }
    celebrate(S.stationId, wasVisited, "Checked in.");
  }
  if (f.id === "nameform") { rememberName($("#me-name").value.trim()); toast("Name saved."); render(); }
  if (f.id === "addstn") {
    const name = $("#ns-name").value.trim(), address = $("#ns-addr").value.trim(), hood = $("#ns-hood").value;
    if (!name || !address) return;
    const pos = placeNear(hood);
    const id = "c-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24) + "-" + rid().slice(0, 4);
    try { await Store.set("stations", id, { name, address, hood, x: pos.x, y: pos.y, side: pos.x > 200 ? "r" : "l", custom: true, by: S.me.name || "", createdAt: Date.now() }); S.confirm = null; toast(name + " added to the map."); }
    catch { toast("Couldn't add the station. Try again."); }
  }
});
function rememberName(n){ if (!n) return; S.me.name = n; ls.set("wewalk:name", n); }
function placeNear(hood){
  const same = stations().filter(s => s.hood === hood);
  const cx = same.reduce((a,s)=>a+s.x,0)/(same.length||1) || 170, cy = same.reduce((a,s)=>a+s.y,0)/(same.length||1) || 250;
  for (let i = 0; i < 40; i++) {
    const a = i * 2.4, r = 14 + i * 2.2, x = Math.round(cx + Math.cos(a)*r), y = Math.round(cy + Math.sin(a)*r);
    if (stations().every(s => Math.hypot(s.x - x, s.y - y) > 16)) return { x, y };
  }
  return { x: Math.round(cx + 12), y: Math.round(cy + 12) };
}
async function saveReview(){
  const d = S.draft, err = $("#f-err");
  const show = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "center", behavior: "smooth" }); };
  d.stationId = $("#f-station").value; d.by = $("#f-by").value.trim(); d.visitedOn = $("#f-date").value;
  d.hotTake = $("#f-hot").value.trim(); d.text = $("#f-text").value.trim();
  if (!d.stationId) return show("Pick which building you're judging.");
  if (!d.by) return show("Add your name so people know whose fault this is.");
  if (!d.visitedOn) return show("Add the date you visited.");
  if (!Object.keys(d.scores).length) return show("Rate at least one thing. Even just the vibe.");
  err.hidden = true;
  const btn = $("#f-submit"); btn.disabled = true; btn.textContent = "Saving…";
  rememberName(d.by); ls.set("wewalk:lastStation", d.stationId);
  const wasVisited = stats(d.stationId).visited;
  const id = d.id || rid();
  const doc = { stationId: d.stationId, by: d.by, authorId: S.me.id, visitedOn: d.visitedOn, scores: d.scores, tags: d.tags, text: d.text, hotTake: d.hotTake, createdAt: d.createdAt || Date.now(), updatedAt: Date.now() };
  try {
    await Store.set("reviews", id, doc);
    for (const p of d.photos) { try { await Store.set("photos", rid(), { stationId: d.stationId, data: p, by: d.by, authorId: S.me.id, createdAt: Date.now() }); } catch {} }
  } catch (e) {
    btn.disabled = false; btn.textContent = d.id ? "Save changes" : "Post review";
    return show(e && e.code === "invalid_argument" ? "This link is read-only for you. Ask for Contributor access." : "That didn't save. Check your connection and try again.");
  }
  if (d.id) { toast("Review updated."); go("station", { id: d.stationId }); return; }
  celebrate(d.stationId, wasVisited, "Review filed.");
}
function celebrate(id, wasVisited, msg){
  const s = stationById(id);
  S.justLit = id; S.sel = id;
  if (!wasVisited) S.justStamped = id;
  go("map"); S.sel = id; render();
  toast(wasVisited ? `${msg} ${s.name} updated.` : `${msg} New passport stamp: ${s.name}.`);
  setTimeout(() => { if (S.justLit === id) { S.justLit = null; } }, 3400);
  const el = document.querySelector(`[data-stn="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}
// downscale a photo so it fits comfortably in a shared document
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const tryAt = (max, q) => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
      let out = tryAt(1000, .72); if (out.length > 200000) out = tryAt(760, .62); if (out.length > 200000) out = tryAt(560, .55);
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
let toastTimer;
function toast(msg){ const r = $("#toast-root"); r.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer = setTimeout(() => r.innerHTML = "", 3200); }

// ---------- theme ----------
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function setTheme(t){ if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; ls.set("wewalk:theme", t); }
(() => { const t = ls.get("wewalk:theme", "system"); if (t !== "system") document.documentElement.dataset.theme = t; })();

// ---------- boot ----------
render();
Store.init().then(() => {
  const set = k => rows => { S[k] = rows; S.loaded = true; if (S.view !== "review") render(); else renderTabs(); };
  Store.watch("reviews", set("reviews"));
  Store.watch("visits", set("visits"));
  Store.watch("stations", rows => { S.custom = rows.map(r => ({ ...r, custom: true })); if (S.view !== "review") render(); });
  Store.watch("retired", set("retired"));
  render();
});
</script>
